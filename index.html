function enrichVariety(){

 let changed=false;
 const byName=new Map(db.exercises.map(e=>[e.name.toLowerCase(),e]));
 for(const a of varietyData.exercises){if(byName.has(a[0].toLowerCase()))continue;let e={id:uid(),name:a[0],muscle:a[1],equipment:a[2],cue:a[3],video:varietyData.videos[a[0]]||''};db.exercises.push(e);byName.set(e.name.toLowerCase(),e);changed=true}
 for(const [name,url] of Object.entries(varietyData.videos)){let e=byName.get(name.toLowerCase());if(e&&!e.video){e.video=url;changed=true}}
 for(const [name,items] of varietyData.programs){if(db.programs.some(p=>p.name===name))continue;db.programs.push({id:uid(),name,items:items.map(([n,sets,lo,hi,pair,rest])=>({id:uid(),exerciseId:byName.get(n.toLowerCase()).id,sets,lo,hi,pair,rest}))});changed=true}

}

function setupFutureRotation(){

let tab='Accueil',editing=null,restTimer=null,restRemaining=0;const save=()=>{const snapshot=JSON.parse(JSON.stringify(db));if(storageMode==='indexeddb'){writeQueue=writeQueue.catch(()=>{}).then(()=>idbPut(snapshot)).then(()=>{savedAt=new Date()}).catch(e=>{storageError='Échec de sauvegarde : '+String(e?.message||e);storageMode='volatile';alert(storageError+' — exporte une sauvegarde JSON.')});return writeQueue}try{localStorage.setItem(KEY,JSON.stringify(snapshot));savedAt=new Date()}catch(e){storageMode='volatile';storageError='Sauvegarde bloquée';alert('Sauvegarde impossible. Exporte immédiatement tes données en JSON.')}};const profile=()=>db.profiles.find(p=>p.id===db.activeProfile)||db.profiles[0];const exercise=id=>db.exercises.find(x=>x.id===id)||{name:'Exercice supprimé',muscle:'Autre',cue:''};const program=id=>db.programs.find(x=>x.id===id);const btn=(text,fn,cls='')=>`<button type="button" class="btn ${cls}" onclick="${fn}">${text}</button>`;const fmt=n=>Number(n||0).toLocaleString('fr-CA',{maximumFractionDigits:1});const date=s=>new Date(s).toLocaleDateString('fr-CA');const volume=s=>(s.entries||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,t)=>b+(t.done?Number(t.weight||0)*Number(t.reps||0):0),0),0);const completed=p=>p.sessions.filter(s=>s.endedAt);function navigate(t){tab=t;render()}function render(){document.getElementById('profileSelect').innerHTML=db.profiles.map(p=>`<option value="${esc(p.id)}" ${p.id===db.activeProfile?'selected':''}>${esc(p.name)}</option>`).join('');document.getElementById('profileSelect').onchange=e=>{db.activeProfile=e.target.value;save();render()};document.getElementById('nav').innerHTML=['Accueil','Entraînement','Programmes','Statistiques','Exercices','Historique','Réglages'].map(t=>`<button class="${tab===t?'active':''}" onclick="navigate('${t}')">${t}</button>`).join('');let out=tab==='Accueil'?home():tab==='Entraînement'?workout():tab==='Programmes'?programsPage():tab==='Statistiques'?stats():tab==='Exercices'?library():tab== /span></div><div class="tiny muted">${esc(ex.muscle)} · ${esc(ex.cue)}</div>${exercisePhoto(ex)}<div class="setrow tiny muted"><span>Série</span><span>Poids (lb)</span><span>Répétitions</span><span>✓</span></div>${e.sets.map((s,si)=>{let prev=lastSet(e.exerciseId,si);return `<div class="setrow"><b>${si+1}</b><div><div class="stepper"><button onclick="changeSet(${ei},${si},'weight',-2.5)">−</button><input type="number" min="0" step="2.5" value="${s.weight}" aria-label="Poids" onchange="setValue(${ei},${si},'weight',this.value)"><button onclick="changeSet(${ei},${si},'weight',2.5)">+</button></div><div class="tiny muted">${prev?'Avant : '+fmt(prev.weight)+' lb':'—'}</div></div><div><div class="stepper"><button onclick="changeSet(${ei},${si},'reps',-1)">−</button><input type="number" min="0" step="1" value="${s.reps}" aria-label="Répétitions" onchange="setValue(${ei},${si},'reps',this.value)"><button onclick="changeSet(${ei},${si},'reps',1)">+</button></div><div class="tiny muted">${prev?'Avant : '+fmt(prev.reps)+' reps':'—'}</div></div><button class="btn small ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`}).join('')}<div class="flex" style="margin-top:12px">${btn('Repos '+e.rest+' s',`startRest(${Number(e.rest)||60})`,'small')}${btn('+ Série',`addWorkoutSet(${ei})`,'small')}${e.sets.length>1?btn('− Série',`removeWorkoutSet(${ei})`,'small'):''}</div></div>${last?"</section>":""}`}).join('')}<div class="card"><label>Notes de séance<textarea class="field" id="sessionNotes" oninput="setNotes(this.value)">${esc(d.notes||'')}</textarea></label><div class="spacer"></div>${btn('Terminer et sauvegarder', 'finishWorkout()','primary')}</div>`}function setValue(e,s,k,v){let x=profile().draft.entries[e].sets[s];x[k]=Math.max(0,Number(v)||0);save()}function changeSet(e,s,k,delta){let x=profile().draft.entries[e].sets[s];x[k]=Math.max(0,Math.round(((Number(x[k])||0)+delta)*100)/100);save();render()}function toggleSet(e,s){let draft=profile().draft;if(!draft)return;let entry=draft.entries[e],x=entry.sets[s],wasDone=x.done;x.done=!x.done;if(!wasDone&&x.done){let pr=program(draft.programId),standard=pr?.mode==='standard';if(standard){startRest(Number(entry.rest)||90)}else{let group=draft.entries.filter(y=>y.pair===entry.pair);let roundComplete=group.every(y=>y.sets[s]?.done===true);if(roundComplete){let duration=Math.max(...group.map(y=>Number(y.rest)||90));startRest(duration)}}}save();render()}function addWorkoutSet(e){profile().draft.entries[e].sets.push({weight:0,reps:10,done:false});save();render()}function removeWorkoutSet(e){profile().draft.entries[e].sets.pop();save();render()}function setNotes(v){profile().draft.notes=v;save()}function finishWorkout(){let p=profile();if(!p.draft)return;let count=p.draft.entries.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);if(!count&&!confirm('Aucune série cochée. Enregistrer quand même ?'))return;p.draft.endedAt=new Date().toISOString();p.sessions.push(p.draft);p.draft=null;save();stopRest();navigate('Historique')}function abandonWorkout(){if(confirm('Abandonner cette séance non terminée ?')){profile().draft=null;save();stopRest();render()}}function startRest(n){stopRest();restRemaining=Math.max(1,n);updateRest();restTimer=setInterval(()=>{restRemaining--;updateRest();if(restRemaining<=0){stopRest();if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}function updateRest(){let x=document.getElementById('restValue');if(x)x.textContent=restRemaining?restRemaining+' s':'Terminé'}function stopRest(){clearInterval(restTimer);restTimer=null;restRemaining=0;updateRest()}function programsPage(){return `<div class="flex between"><h1>Programmes</h1>${btn('+ Programme','editProgram()','primary')}</div>${modeSelector()}${programMode==='standard'?`<p class="muted">Mode conventionnel : toutes les séries d’un exercice, puis le suivant. Trois programmes Full Body couvrant les principaux groupes musculaires.</p>${standardRotationPanel()}`:`<p class="muted">Supersets A1/A2, B1/B2, C1/C2 : alterne les deux exercices avant de prendre ton repos. Les programmes restent modifiables.</p><div class="notice" style="margin-bottom:16px"><b>Rotation active : ${db.activeRotation||1}</b><p class="tiny muted">${db.activeRotation===2?'Les anciens programmes sont masqués, mais conservés avec leur historique.':'8 nouveaux programmes sont déjà préparés et cachés pour ta prochaine rotation (dans 6–8 semaines).'}</p>${btn(db.activeRotation===2?'Réactiver la rotation 1':'Activer la rotation 2', 'switchRotation()', 'small')}</div>`}${activePrograms().map(p=>`<div class="card"><div class="flex between"><h2>${esc(p.name)}</h2><div class="flex">${btn('Modifier',`editProgram('${p.id}')`,'small')}${btn('Dupliquer',`duplicateProgram('${p.id}')`,'small')}${btn('Supprimer',`deleteProgram('${p.id}')`,'danger small')}</div></div>${programLastSeen(p)}${p.items.map(i=>`<div class="flex tiny" style="padding:7px 0;border-top:1px solid #f0f2f5"><span class="tag">${esc(i.pair)}${p.items.filter(x=>x.pair===i.pair).length>1?(p.items.filter(x=>x.pair===i.pair).indexOf(i)+1):""}</span><span style="flex:1">${esc(exercise(i.exerciseId).name)}</span><span>${i.sets} × ${i.lo}–${i.hi}</span></div>`).join('')}</div>`).join('')}`}function editProgram(id){editing=id||null;let p=id?program(id):{name:'Nouveau programme',items:[]};openModal('Modifier le programme',`<label>Nom<input class="field" id="prName" value="${esc(p.name)}"></label><div class="spacer"></div><div id="prItems">${p.items.map((i,j)=>programItemForm(i,j)).join('')}</div><div class="flex" style="margin:12px 0">${btn('+ Exercice','appendProgramItem()','small')}</div>${btn('Enregistrer','saveProgram()','primary')}`)}function programItemForm(i,j){return `<div class="card" data-program-item><div class="flex between"><b>Exercice ${j+1}</b><div class="flex">${btn('↑','moveProgramItem(this,-1)','small')}${btn('↓','moveProgramItem(this,1)','small')}${btn('✕','this.closest(\'[data-program-item]\').remove()','danger small')}</div></div><label>Exercice<select class="field exSelect">${db.exercises.map(e=>`<option value="${e.id}" ${i.exerciseId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><label>Séries<input class="field setsInput" type="number" min="1" value="${i.sets}"></label><label>Min reps<input class="field loInput" type="number" min="1" value="${i.lo}"></label><label>Max reps<input class="field hiInput" type="number" min="1" value="${i.hi}"></label><label>Groupe<input class="field pairInput" value="${esc(i.pair)}"></label><label>Repos (s)<input class="field restInput" type="number" min="0" value="${i.rest}"></label></div></div>`}function appendProgramItem(){let c=document.getElementById('prItems');c.insertAdjacentHTML('beforeend',programItemForm({exerciseId:db.exercises[0].id,sets:3,lo:8,hi:12,pair:'A',rest:90},c.children.length))}function moveProgramItem(b,delta){let e=b.closest('[data-program-item]'),parent=e.parentNode,other=delta<0?e.previousElementSibling:e.nextElementSibling;if(other){if(delta<0)parent.insertBefore(e,other);else parent.insertBefore(other,e)}}function saveProgram(){let name=document.getElementById('prName').value.trim();if(!name)return alert('Nom requis');let items=[...document.querySelectorAll('[data-program-item]')].map(el=>{let q=c=>el.querySelector(c).value;return{id:uid(),exerciseId:q('.exSelect'),sets:Math.max(1,Math.floor(+q('.setsInput')||1)),lo:Math.max(1,+q('.loInput')||1),hi:Math.max(1,+q('.hiInput')||1),pair:q('.pairInput')||'A',rest:Math.max(0,+q('.restInput')||0)}});if(!items.length)return alert('Ajoute au moins un exercice');if(editing){Object.assign(program(editing),{name,items})}else db.programs.push({id:uid(),name,items,mode:programMode,rotation:programMode==='standard'?(db.standardRotation||1):(db.activeRotation||1)});save();closeModal();render()}function duplicateProgram(id){let p=structuredClone(program(id));p.id=uid();p.name+=' (copie)';p.items.forEach(i=>i.id=uid());db.programs.push(p);save();render()}function deleteProgram(id){if(confirm('Supprimer ce programme ? Les séances passées seront conservées.')){db.programs=db.programs.filter(x=>x.id!==id);save();render()}}function library(){return `<div class="flex between"><h1>Bibliothèque d’exercices</h1>${btn('+ Exercice','editExercise()','primary')}</div><input class="field" placeholder="Rechercher un exercice..." oninput="filterExercises(this.value)"><div id="exerciseList">${db.exercises.map(e=>exerciseCard(e)).join('')}</div>`}function exerciseCard(e){return `<div class="card ex-card" data-search="${esc((e.name+' '+e.muscle).toLowerCase())}"><div class="flex between"><div><h3>${esc(e.name)}</h3><span class="tag">${esc(e.muscle)}</span> <span class="tiny muted">${esc(e.equipment)}</span></div>${btn('Modifier',`editExercise('${e.id}')`,'small')}</div><p class="muted tiny">${esc(e.cue)}</p>${exercisePhoto(e)}</div>`}function filterExercises(v){document.querySelectorAll('.ex-card').forEach(e=>e.classList.toggle('hidden',!e.dataset.search.includes(v.toLowerCase())))}function safeUrl(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}function editExercise(id){editing=id||null;let e=id?exercise(id):{name:'',muscle:'Autre',equipment:'Haltères',cue:'',video:''};openModal('Exercice',`<div class="stack"><label>Nom<input id="exName" class="field" value="${esc(e.name)}"></label><label>Groupe musculaire<input id="exMuscle" class="field" value="${esc(e.muscle)}"></label><label>Équipement<input id="exEquipment" class="field" value="${esc(e.equipment)}"></label><label>Instructions<textarea id="exCue" class="field">${esc(e.cue)}</textarea></label><div class="flex">${btn('Enregistrer','saveExercise()','primary')}${editing?btn('Supprimer','deleteExercise()','danger'):''}</div></div>`)}function saveExercise(){let name=document.getElementById('exName').value.trim();if(!name)return alert('Nom requis');let data={name,muscle:document.getElementById('exMuscle').value,equipment:document.getElementById('exEquipment').value,cue:document.getElementById('exCue').value,video:''};if(editing)Object.assign(exercise(editing),data);else db.exercises.push({id:uid(),...data});save();closeModal();render()}function deleteExercise(){if(db.programs.some(p=>p.items.some(i=>i.exerciseId===editing))||db.profiles.some(p=>p.sessions.some(s=>s.entries.some(e=>e.exerciseId===editing))))return alert('Cet exercice est utilisé dans un programme ou dans un historique. Remplace-le avant de le supprimer.');if(confirm('Supprimer cet exercice ?')){db.exercises=db.exercises.filter(e=>e.id!==editing);save();closeModal();render()}}function historyPage(){let s=[...completed(profile())].reverse();return `<h1>Historique</h1>${s.length?'':`<div class="notice">Aucune séance enregistrée pour ce profil.</div>`}${s.map(x=>`<div class="card"><div class="flex between"><div><h3>${esc(x.programName)}</h3><div class="tiny muted">${date(x.endedAt)} · ${Math.round((new Date(x.endedAt)-new Date(x.startedAt))/60000)} min · ${fmt(volume(x))} lb de volume</div></div><div class="flex">${btn('Détails',`sessionDetails('${x.id}')`,'small')}${btn('Supprimer',`deleteSession('${x.id}')`,'danger small')}</div></div>${x.notes?`<p class="muted tiny">${esc(x.notes)}</p>`:''}</div>`).join('')}`}function sessionDetails(id){let s=profile().sessions.find(x=>x.id===id);openModal('Détails de séance',`<h3>${esc(s.programName)}</h3><p class="muted">${date(s.endedAt)}</p>${s.entries.map(e=>`<div class="card"><b>${esc(exercise(e.exerciseId).name)}</b>${e.sets.map((t,i)=>`<div class="tiny" style="padding-top:6px">S${i+1} : ${fmt(t.weight)} lb × ${fmt(t.reps)} ${t.done?'✓':'(non terminée)'}</div>`).join('')}</div>`).join('')}${btn('Fermer','closeModal()')}`)}function deleteSession(id){if(confirm('Supprimer définitivement cette séance ?')){profile().sessions=profile().sessions.filter(x=>x.id!==id);save();render()}}function stats(){let s=completed(profile()),total=s.reduce((a,b)=>a+volume(b),0),byWeek={};s.forEach(x=>{let d=new Date(x.endedAt),start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));let k=start.toISOString().slice(0,10);byWeek[k]=(byWeek[k]||0)+volume(x)});let weeks=Object.entries(byWeek).sort((a,b)=>a[0].localeCompare(b[0])).slice(-10),max=Math.max(1,...weeks.map(x=>x[1]));let records={};s.forEach(x=>x.entries.forEach(e=>e.sets.filter(t=>t.done).forEach(t=>{let key=e.exerciseId;if(!records[key]||+t.weight>records[key].weight)records[key]={weight:+t.weight,reps:+t.reps}})));return `<h1>Statistiques</h1><div class="grid"><div class="card"><div class="muted">Séances</div><div class="stat">${s.length}</div></div><div class="card"><div class="muted">Volume total</div><div class="stat">${fmt(total)} lb</div></div><div class="card"><div class="muted">Moyenne / séance</div><div class="stat">${fmt(s.length?total/s.length:0)} lb</div></div></div><div class="card"><h2>Volume par semaine (lb)</h2>${weeks.length?`<div class="chart">${weeks.map(([k,v])=>`<div class="chartcol" title="${esc(k)} : ${fmt(v)} lb"><span class="tiny">${fmt(v)}</span><div class="chartbar" style="height:${Math.max(3,v/max*115)}px"></div><span class="chartlabel">${k.slice(5)}</span></div>`).join('')}</div>`:'<p class="muted">Termine une séance pour afficher un graphique.</p>'}</div><div class="card"><h2>Records de poids par exercice</h2>${Object.entries(records).sort((a,b)=>exercise(a[0]).name.localeCompare(exercise(b[0]).name)).map(([id,r])=>`<div class="flex between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(exercise(id).name)}</span><b>${fmt(r.weight)} lb × ${fmt(r.reps)}</b></div>`).join('')||'<p class="muted">Aucun record pour le moment.</p>'}</div><div class="card"><h2>Progression par exercice</h2><select class="field" id="chartExercise" onchange="renderExerciseProgress(this.value)">${db.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><div id="exerciseProgress" class="muted tiny" style="margin-top:15px">Choisis un exercice pour voir sa progression.</div></div>`}function renderExerciseProgress(id){let points=completed(profile()).flatMap(s=>s.entries.filter(e=>e.exerciseId===id).map(e=>({date:date(s.endedAt),max:Math.max(0,...e.sets.filter(t=>t.done).map(t=>Number(t.weight)||0))}))).filter(x=>x.max>0).slice(-12),max=Math.max(1,...points.map(x=>x.max));document.getElementById('exerciseProgress').innerHTML=points.length?`<div class="chart">${points.map(p=>`<div class="chartcol" title="${esc(p.date)}"><span class="tiny">${fmt(p.max)}</span><div class="chartbar" style="height:${Math.max(3,115*p.max/max)}px"></div><span class="chartlabel">${esc(p.date.slice(0,5))}</span></div>`).join('')}</div>`:'Aucune donnée pour cet exercice.'}function openProfileDialog(){openModal('Profils',`<div class="stack">${db.profiles.map(p=>`<div class="flex between"><b>${esc(p.name)}</b><div class="flex">${btn('Renommer',`renameProfile('${p.id}')`,'small')}${db.profiles.length>1?btn('Supprimer',`deleteProfile('${p.id}')`,'danger small'):''}</div></div>`).join('')}<label>Nouveau profil<input id="newProfileName" class="field" placeholder="Nom"></label>${btn('Ajouter','addProfile()','primary')}</div>`)}function addProfile(){let name=document.getElementById('newProfileName').value.trim();if(!name)return;let p={id:uid(),name,sessions:[],draft:null};db.profiles.push(p);db.activeProfile=p.id;save();closeModal();render()}function renameProfile(id){let p=db.profiles.find(x=>x.id===id),name=prompt('Nom du profil',p.name);if(name?.trim()){p.name=name.trim();save();openProfileDialog();render()}}function deleteProfile(id){if(!confirm('Supprimer ce profil et toutes ses séances ?'))return;db.profiles=db.profiles.filter(p=>p.id!==id);if(db.activeProfile===id)db.activeProfile=db.profiles[0].id;save();openProfileDialog();render()}function settings(){return `<h1>Réglages et sauvegardes</h1><div class="card"><h2>Sauvegarde</h2><p class="muted">Sauvegarde automatique après chaque modification, sur ce téléphone et dans ce navigateur. Les données ne se synchronisent pas avec d’autres appareils.</p><p class="tiny"><b>État :</b> ${esc(storageStatus())}${storageError?`<br><span class="muted">${esc(storageError)}</span>`:""}</p><p class="tiny muted">Important : utiliser toujours la même adresse ou le même fichier dans le même navigateur, éviter le mode privé et ne pas effacer les données du site. Une sauvegarde JSON occasionnelle reste recommandée.</p><div class="flex">${btn('Exporter JSON','exportJSON()','primary')}${btn('Exporter CSV','exportCSV()')}<label class="btn" style="display:inline-block;cursor:pointer">Importer JSON<input type="file" accept=".json,application/json" hidden onchange="importJSON(this.files[0])"></label></div></div><div class="card"><h2>Confidentialité</h2><p class="muted">Aucun compte ni serveur. Les profils partagent le même appareil et ne sont pas protégés par mot de passe.</p>${btn('Réinitialiser toutes les données','resetAll()','danger')}</div>`}function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportJSON(){download('bowflex-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let rows=[['Profil','Date','Programme','Exercice','Série','Poids_lb','Répétitions','Terminée']];db.profiles.forEach(p=>p.sessions.forEach(s=>s.entries.forEach(e=>e.sets.forEach((t,i)=>rows.push([p.name,s.endedAt,s.programName,exercise(e.exerciseId).name,i+1,t.weight,t.reps,t.done?'Oui':'Non'])))));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('bowflex-historique.csv','\ufeff'+csv,'text/csv;charset=utf-8')}async function importJSON(file){if(!file)return;try{let d=JSON.parse(await file.text());if(d.version!==2||!Array.isArray(d.profiles)||!Array.isArray(d.programs)||!Array.isArray(d.exercises)||!d.profiles.length)throw Error('Format non reconnu');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;db=d;enrichVariety();migrateEnglishNames();setupFutureRotation();db.activeProfile=db.profiles.some(p=>p.id===db.activeProfile)?db.activeProfile:db.profiles[0].id;save();render();alert('Sauvegarde importée')}catch(e){alert('Importation impossible : '+e.message)}}function resetAll(){if(confirm('Effacer tous les profils, historiques et programmes ? Cette action est irréversible.')){db=initial();enrichVariety();migrateEnglishNames();setupFutureRotation();save();render()}}function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close()}initStorage();
</script></body></html>
